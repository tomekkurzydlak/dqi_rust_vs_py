[package]
name = "dqi_poc"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rust_dqi_cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
once_cell = "1"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
ort = { version = "2.0.0-rc.10", features = ["download-binaries", "ndarray"] }
